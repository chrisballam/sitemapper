# Example sitemapper config. Load with:  python sitemapper.py --config this.ini
# Any key mirrors a CLI flag (dashes or underscores). CLI flags still override.

[sitemapper]
url = https://example.com
output = /var/www/example.com/sitemap.xml
state = /var/lib/sitemapper/example.state.json

# Politeness
delay = 1.0
timeout = 20
max_pages = 50000
max_depth = 100

# Scope / content
include_subdomains = false
include_docs = true
ignore_query = false

# Output
gzip = false
# public_path = /            ; only needed for large sites that shard + index

# JavaScript rendering (requires `pip install playwright`)
render_js = false
